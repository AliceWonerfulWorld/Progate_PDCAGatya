<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSR 3D プレビュー (dev only)</title>
  <!--
    開発確認用のスタンドアロンページ。アプリ本体からはリンクされていない。
    `npm run dev` して http://localhost:5173/ssr-preview.html を開く。
    src/features/collection/Character3DViewer.tsx と同じ model-viewer 設定を再現:
      左右±45degクランプ / 上下固定(phi 80deg) / ズーム・パン無効 / auto-rotateなし
    コミット前に削除してよい。
  -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #fafaf9; color: #1c1917; padding: 24px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.note { color: #78716c; margin: 0 0 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; }
    .card { width: 320px; }
    .stage {
      position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(to bottom, #fef3c7, #ffffff 55%, #e7e5e4);
    }
    .stage img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; background-color: transparent; --poster-color: transparent; }
    .meta { margin-top: 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .meta b { font-size: 15px; }
    .meta code { color: #78716c; font-size: 12px; }
    .hint { margin-top: 4px; color: #a8a29e; font-size: 12px; }
  </style>
</head>
<body>
  <h1>SSR 3D プレビュー <span style="color:#a8a29e;font-weight:400">(dev only / アプリ非公開)</span></h1>
  <p class="note">左右ドラッグで ±45deg まで回転。上下・ズーム・パンは固定。model-viewer は jsDelivr CDN から読み込み。</p>

  <div class="grid">
    <div class="card">
      <div class="stage">
        <img class="bg" src="/characters/akatuki-bg.webp" alt="" />
        <model-viewer
          src="/characters/Yusha.glb"
          poster="/characters/ssr_001.webp"
          alt="アカツキ"
          camera-controls disable-zoom disable-pan
          interaction-prompt="none"
          camera-orbit="0deg 80deg 35%"
          min-camera-orbit="-45deg 80deg 35%"
          max-camera-orbit="45deg 80deg 35%"
          field-of-view="22deg"
          environment-image="neutral"
          shadow-intensity="0.4"
        ></model-viewer>
      </div>
      <div class="meta"><b>アカツキ (男性)</b><code>ssr_001 / Yusha.glb</code></div>
      <div class="hint">左右にドラッグして回転範囲を確認</div>
    </div>

    <div class="card">
      <div class="stage">
        <img class="bg" src="/characters/eien-bg.webp" alt="" />
        <model-viewer
          src="/characters/whi.glb"
          poster="/characters/ssr_002.webp"
          alt="エイエン"
          camera-controls disable-zoom disable-pan
          interaction-prompt="none"
          camera-orbit="0deg 80deg auto"
          min-camera-orbit="-45deg 80deg auto"
          max-camera-orbit="45deg 80deg auto"
          environment-image="neutral"
          shadow-intensity="0.4"
        ></model-viewer>
      </div>
      <div class="meta"><b>エイエン (女性)</b><code>ssr_002 / whi.glb</code></div>
      <div class="hint">左右にドラッグして回転範囲を確認</div>
    </div>
  </div>
</body>
</html>
